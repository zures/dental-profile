<svg xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636" role="img" aria-labelledby="title desc"><title id="title">Bằng chuyên môn — ảnh giữ chỗ</title><desc id="desc">Mẫu bố cục minh họa, không phải giấy tờ hoặc chứng nhận thật.</desc><rect width="900" height="636" rx="24" fill="#F5FBF8"/><rect x="36" y="36" width="828" height="564" rx="16" fill="white" stroke="#B7D6C9" stroke-width="2" stroke-dasharray="10 8"/><rect x="70" y="68" width="230" height="40" rx="20" fill="#FFF2C6"/><text x="185" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#755232">ẢNH GIỮ CHỖ · 01</text><g stroke="#3DBDAA" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M407 158h66l28 28v94h-94z"/><path d="M473 158v28h28M427 212h54M427 232h54M427 252h36"/></g><text x="450" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#174F48">Bằng chuyên môn</text><text x="450" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#536F69">Ảnh giấy tờ sẽ được bổ sung sau</text><path d="M250 440h400" stroke="#D6E9E1" stroke-width="2"/><text x="450" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#755232">MẪU MINH HỌA — KHÔNG PHẢI GIẤY TỜ THẬT</text><text x="450" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#536F69">Không xác nhận bằng cấp hoặc phạm vi hành nghề</text></svg>
